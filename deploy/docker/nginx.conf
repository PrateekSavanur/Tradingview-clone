# Serves the SPA and proxies /api and /ws so the browser talks to one origin.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream api        { server api:8081; }
upstream ws_gateway { server ws-gateway:8080; }

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /ws {
    proxy_pass http://ws_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
    # Never buffer: frames must reach the browser as soon as the gateway writes them.
    proxy_buffering off;
    tcp_nodelay on;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
