apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescale
spec:
  serviceName: timescale
  replicas: 1
  selector: { matchLabels: { app: timescale } }
  template:
    metadata: { labels: { app: timescale } }
    spec:
      containers:
        - name: timescale
          image: timescale/timescaledb:2.22.1-pg17
          env:
            - { name: POSTGRES_USER, value: chartdeck }
            - { name: POSTGRES_DB, value: chartdeck }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: chartdeck-db, key: password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "chartdeck", "-d", "chartdeck"] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["pg_isready", "-U", "chartdeck", "-d", "chartdeck"] }, periodSeconds: 15, failureThreshold: 6 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path # k3s default
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: timescale
spec:
  clusterIP: None
  selector: { app: timescale }
  ports: [{ port: 5432 }]
