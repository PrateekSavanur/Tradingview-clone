apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8081", prometheus.io/path: /metrics }
    spec:
      containers:
        - name: api
          image: chartdeck/api
          envFrom: [{ configMapRef: { name: chartdeck-config } }]
          env:
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: chartdeck-db, key: password } } }
            - { name: DATABASE_URL, value: "postgres://chartdeck:$(DB_PASSWORD)@timescale:5432/chartdeck" }
            # Shared by all replicas so any of them can verify any access token.
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: chartdeck-auth, key: jwt-secret } } }
          ports: [{ name: http, containerPort: 8081 }]
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 2, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext: { runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [{ name: http, port: 8081 }]
