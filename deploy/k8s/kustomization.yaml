apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chartdeck
labels:
  - pairs: { app.kubernetes.io/part-of: chartdeck }
resources:
  - namespace.yaml
  - config.yaml
  - redis.yaml
  - timescale.yaml
  - ingest.yaml
  - ws-gateway.yaml
  - api.yaml
  - alerts.yaml
  - web.yaml
  - ingress.yaml
patches:
  # Kubernetes injects <SERVICE>_PORT=tcp://... variables for every Service; the one for the `api`
  # Service is API_PORT, which is also the api's own port setting, so it crashed on start. Every
  # service here finds the others by DNS, so the injected variables are only harmful.
  - target: { kind: "(Deployment|StatefulSet)" }
    patch: |
      - { op: add, path: /spec/template/spec/enableServiceLinks, value: false }
# Point these at your registry, e.g. registry.lan:5000/chartdeck/ingest
images:
  - { name: chartdeck/ingest, newTag: "0.1.0" }
  - { name: chartdeck/ws-gateway, newTag: "0.1.0" }
  - { name: chartdeck/api, newTag: "0.1.0" }
  - { name: chartdeck/alerts, newTag: "0.1.0" }
  - { name: chartdeck/web, newTag: "0.1.0" }
