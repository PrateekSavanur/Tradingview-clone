apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chartdeck
labels:
  - pairs: { app.kubernetes.io/part-of: chartdeck }
resources:
  - namespace.yaml
  - config.yaml
  - redis.yaml
  - timescale.yaml
  - ingest.yaml
  - ws-gateway.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
# Point these at your registry, e.g. registry.lan:5000/chartdeck/ingest
images:
  - { name: chartdeck/ingest, newTag: "0.1.0" }
  - { name: chartdeck/ws-gateway, newTag: "0.1.0" }
  - { name: chartdeck/api, newTag: "0.1.0" }
  - { name: chartdeck/web, newTag: "0.1.0" }
